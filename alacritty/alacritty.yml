
# Font
font:
  normal:
    family: "JetBrainsMono Nerd Font"
    style: Regular
  bold:
    family: "JetBrainsMono Nerd Font"
    style: Bold
  italic:
    family: "JetBrainsMono Nerd Font"
    style: Italic
  size: 8

# Window
window:
  opacity: 0.7
  padding:
    x: 8
    y: 6
  dynamic_padding: true

# Catppuccin Mocha Colors
colors:
  primary:
    background: "#1e1e2e"
    foreground: "#cdd6f4"

  cursor:
    text: "#1e1e2e"
    cursor: "#f5e0dc"

  selection:
    text: "#1e1e2e"
    background: "#f5e0dc"

  normal:
    black:   "#45475a"
    red:     "#f38ba8"
    green:   "#a6e3a1"
    yellow:  "#f9e2af"
    blue:    "#89b4fa"
    magenta: "#f5c2e7"
    cyan:    "#94e2d5"
    white:   "#bac2de"

  bright:
    black:   "#585b70"
    red:     "#f38ba8"
    green:   "#a6e3a1"
    yellow:  "#f9e2af"
    blue:    "#89b4fa"
    magenta: "#f5c2e7"
    cyan:    "#94e2d5"
    white:   "#a6adc8"

# Shell
shell:
  program: /bin/zsh

# Environment
env:
  LANG: "en_US.UTF-8"

